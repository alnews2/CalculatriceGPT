name: Android Release

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to determine versionName from app/build.gradle.kts"
            exit 1
          fi

          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)\.)*(0|[1-9][0-9]*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::versionName '$VERSION' is not valid SemVer 2.0.0"
            echo "::error::Expected MAJOR.MINOR.PATCH[-prerelease][+build], for example 1.0.0 or 1.2.0-rc.1"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether a new release is required
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          LATEST_TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].tag_name // ""')

          if [ -z "$LATEST_TAG" ]; then
            echo "No published GitHub Release found; release is required."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_VERSION="${LATEST_TAG#v}"
          if [[ "$LATEST_TAG" != v* || ! "$LATEST_VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Latest GitHub Release tag '$LATEST_TAG' is not a valid v<SemVer 2.0.0> tag"
            exit 1
          fi

          export LATEST_VERSION CURRENT_VERSION
          python3 <<'PY'
          import os
          import re
          import sys

          pattern = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-((?:0|[1-9]\d*|[0-9A-Za-z-]+)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]+))*))?"
              r"(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$"
          )

          def parse(version):
              match = pattern.fullmatch(version)
              if not match:
                  raise ValueError(f"invalid SemVer: {version}")
              major, minor, patch, prerelease, _build = match.groups()
              identifiers = [] if prerelease is None else prerelease.split(".")
              return int(major), int(minor), int(patch), identifiers

          def compare(a, b):
              a_core = a[:3]
              b_core = b[:3]
              if a_core != b_core:
                  return (a_core > b_core) - (a_core < b_core)

              a_pre, b_pre = a[3], b[3]
              if not a_pre and not b_pre:
                  return 0
              if not a_pre:
                  return 1
              if not b_pre:
                  return -1

              for left, right in zip(a_pre, b_pre):
                  if left == right:
                      continue
                  left_num = left.isdigit()
                  right_num = right.isdigit()
                  if left_num and right_num:
                      return (int(left) > int(right)) - (int(left) < int(right))
                  if left_num != right_num:
                      return -1 if left_num else 1
                  return (left > right) - (left < right)

              return (len(a_pre) > len(b_pre)) - (len(a_pre) < len(b_pre))

          current = parse(os.environ["CURRENT_VERSION"])
          latest = parse(os.environ["LATEST_VERSION"])
          result = compare(current, latest)

          if result == 0:
              print(
                  f"Application version {os.environ['CURRENT_VERSION']} has the same "
                  f"SemVer precedence as the latest release {os.environ['LATEST_VERSION']}; "
                  "no new release will be created."
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("should_release=false\n")
          elif result < 0:
              print(
                  f"::error::Application version {os.environ['CURRENT_VERSION']} is lower "
                  f"than the latest release {os.environ['LATEST_VERSION']}"
              )
              sys.exit(1)
          else:
              print(
                  f"Application version {os.environ['CURRENT_VERSION']} is newer than "
                  f"the latest release {os.environ['LATEST_VERSION']}; release is required."
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("should_release=true\n")
          PY

      - name: Verify tag does not already exist
        if: ${{ steps.release-check.outputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for $TAG"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Git tag $TAG already exists"
            exit 1
          fi

      - name: Download validated APK
        if: ${{ steps.release-check.outputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID"             --repo "${{ github.repository }}"             --name CalculatriceGPT-debug             --dir release-apk

          APK=$(find release-apk -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Validated APK artifact was not found"
            exit 1
          fi
          cp "$APK" app-debug.apk

      - name: Extract changelog section
        if: ${{ steps.release-check.outputs.should_release == 'true' }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        if: ${{ steps.release-check.outputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG"             app-debug.apk             --title "CalculatriceGPT $TAG"             --notes-file release-notes.md             --target "${{ github.event.workflow_run.head_sha }}"
